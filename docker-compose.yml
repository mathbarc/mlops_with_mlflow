version: "3.7"

services:
  minio:
    container_name: minio
    image: minio/minio
    environment:
      - MINIO_CONSOLE_ADDRESS=:9001
      - MINIO_ROOT_USER=mlops-demo
      - MINIO_ROOT_PASSWORD=mlops-demo
    ports:
      - "9000:9000"
      - "9001:9001"
    command:
      - server
      - /data
    volumes:
      - minio-data:/data

  createbuckets:
    container_name: createbuckets
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 "mlops-demo" "mlops-demo";
      /usr/bin/mc mb myminio/mlops;
      /usr/bin/mc policy set download myminio/mlops;
      /usr/bin/mc policy set upload myminio/mlops;
      /usr/bin/mc policy set list myminio/mlops;
      exit 0;
      "

  postgres:
    container_name: mlflow-db
    image: postgres
    environment:
      - POSTGRES_USER=mlops-db
      - POSTGRES_PASSWORD=mlops-db
      - POSTGRES_DB=mlops-db
      - PGDATA=/var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data

  mlflow:
    container_name: mlflow
    image: ghcr.io/mathbarc/mlflow:latest
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000/
      - AWS_ACCESS_KEY_ID=mlops-demo
      - AWS_SECRET_ACCESS_KEY=mlops-demo
    command:
      - server
      - --host=0.0.0.0
      - --port=9002
      - --backend-store-uri=postgresql://mlops-db:mlops-db@postgres:5432/mlops-db
      - --artifacts-destination=s3://mlops/
      - --serve-artifacts
      - --workers=2
    ports:
      - "9002:9002"
    depends_on:
      - minio
      - createbuckets
      - postgres

  train_model:
    container_name: train_model
    build: ./train
    image: mlops-demo/train
    environment:
      - MLFLOW_ENDPOINT=http://mlflow:9002
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
    depends_on:
      - mlflow

  sample_api:
    container_name: sample_api
    build: ./sample_api
    image: mlops-demo/sample_api
    ports:
      - 9003:5000
    environment:
      - MODEL_URI=models:/rice_classifier/1
      - MLFLOW_ENDPOINT=http://mlflow:9002
      - MLFLOW_TRACKING_URI=http://mlflow:9002
    depends_on:
      - mlflow

  frontend:
    container_name: frontend
    build:
      context: ./frontend/
      args:
        API_ENDPOINT: 'http:\/\/localhost:9003'
    image: mlops-demo/frontend
    ports:
      - 9004:80
    depends_on:
      - mlflow
volumes:
  minio-data:
  mlflow-db-data:
